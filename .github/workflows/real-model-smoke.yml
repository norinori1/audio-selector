name: Real Model Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-model-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    name: Windows Python 3.11 CLAP and Qdrant
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      AUDIO_SELECTOR_REAL_MODEL: '1'
      HF_HUB_OFFLINE: '0'
      TRANSFORMERS_OFFLINE: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-retrieval.lock.txt
            pyproject.toml
      - name: Cache public pinned model downloads only
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/audio-selector-public-hf/hub
          key: public-clap-${{ runner.os }}-py311-${{ hashFiles('audio_selector/contract.py', 'requirements-retrieval.lock.txt', 'pyproject.toml') }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-retrieval.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Existing regressions with real CLAP and persistent Qdrant
        env:
          HF_HOME: ${{ runner.temp }}/audio-selector-public-hf
        run: python scripts/ci_checks.py heavy
      - name: Ensure validation did not mutate tracked evidence
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --exit-code
          exit $LASTEXITCODE
